server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: bff-aprendizaje-postulante

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

apiTitle: BFF Aprendizaje Postulante
apiDescription: API para gestión de postulación de aprendizaje
apiVersion: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: ping
        liveness:
          include: ping
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    pe.gob.oece: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

resilience4j:
  circuitbreaker:
    instances:
      aprendizajePostulacionBackend:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    instances:
      default:
        timeout-duration: 10s
  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 200ms

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  clients:
    aprendizaje-postulacion:
      base-url: ${APRENDIZAJE_POSTULACION_SERVICE_URL:http://localhost:81}
      connect-timeout-ms: ${CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${READ_TIMEOUT_MS:5000}
      response-timeout-ms: ${RESPONSE_TIMEOUT_MS:8000}
  
